name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Style, lint, unit tests, release build
        run: ./gradlew :app:ktlintCheck :app:lintRelease :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

  live-api:
    # Weekly, against the real MangaDex API, to catch changes on their side.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Live API tests
        env:
          LIVE: 'true'
        run: ./gradlew :app:testDebugUnitTest --rerun
