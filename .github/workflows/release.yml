name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and bundle
        run: >
          ./gradlew :app:assembleRelease :app:bundleRelease
          -PVERSION_NAME=${GITHUB_REF_NAME#v}
          -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
          -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
